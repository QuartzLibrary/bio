[package]
name = "utile"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Utility library"
repository = "https://github.com/QuartzLibrary/bio"

[features]
nightly = []

[dependencies]
ahash = "0.8"
content_disposition = "0.4"
futures = "0.3"
log = "0.4"
nohash-hasher = "0.2"
pin-project = "1"
plotly = "0.12"
rand = "0.10"
regex = "1"
reqwest = { version = "0.12" }
rmp-serde = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }
url = { version = "2", features = ["serde"] }
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
wasm-bindgen-futures = "0.4"
_getrandom4 = { version = "0.4", features = ["wasm_js"], package = "getrandom" }
_getrandom3 = { version = "0.3", features = ["wasm_js"], package = "getrandom" }
_getrandom2 = { version = "0.2", features = ["js"], package = "getrandom" }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
